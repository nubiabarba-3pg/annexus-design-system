      # Dev 2 unblocked after 3.1 merges — picks up wave 2

  - wave: 2
    stories: [3.2, 3.3, 3.4, 3.5]
    assignments:
      - dev: 1
        stories: [3.2, 3.3]
      - dev: 2
        stories: [3.4, 3.5]

  - wave: 3
    stories: [3.6]
    assignments:
      - dev: 1
        stories: [3.6]

  # ── CYCLE-2 P0 Primitives ────────────────────────────────────────────────────
