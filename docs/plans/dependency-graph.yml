    stories: [1.1, 1.2, 1.3, 1.4, 1.5, 1.6, 2.1, 2.2]
    assignments:
      # Round-robin by complexity depth. Advisory — devs may swap before starting.
      - dev: 1
        stories: [1.1, 1.3, 1.5, 2.1]
      - dev: 2
        stories: [1.2, 1.4, 1.6, 2.2]

  - wave: 5
    stories: [2.3, 2.4]
    assignments:
